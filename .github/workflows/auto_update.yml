name: Opinet Monthly Fuel Auto Updater

on:
  schedule:
    # 매월 1일 한국 시간 오전 9시 (UTC 00:00) 자동 실행
    - cron: '0 0 1 * *'
  workflow_dispatch: # 수동으로 즉시 실행 버튼 지원

permissions:
  contents: write

jobs:
  update-fuel-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Update Script
        run: |
          python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update fuel data for $(date +'%Y-%m')" && git push)
